# Bayview help desk: osTicket (web) + MariaDB (database)
# Start:   docker compose up -d --build
# Stop:    docker compose down          (keeps your data)
# Logs:    docker compose logs -f osticket

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  osticket:
    build: ./osticket
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Listen ONLY on the host's VMware lab adapter (VMnet8), not on home Wi-Fi.
      # Browse to http://10.10.10.1:8080 from the host or the lab VMs.
      - "${LAB_HOST_IP:?Set LAB_HOST_IP in .env}:8080:80"
    extra_hosts:
      # Lets the container find the domain controller by name (needed for the TLS certificate check)
      - "dc01.bayview.internal:${DC_IP:?Set DC_IP in .env}"
    volumes:
      - osticket-config:/var/osticket-config
      - ./plugins:/var/osticket-plugins:ro
      - ./certs:/usr/local/share/ca-certificates/bayview:ro

volumes:
  db-data:
  osticket-config:
